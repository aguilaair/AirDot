# Colored ring around the edge of the round display, controlled from Home Assistant.
# Light color sets the ring color, light brightness sets its opacity.

output:
  - platform: template
    id: screen_ring_red_output
    type: float
    write_action:
      - lambda: "(void) state;"
  - platform: template
    id: screen_ring_green_output
    type: float
    write_action:
      - lambda: "(void) state;"
  - platform: template
    id: screen_ring_blue_output
    type: float
    write_action:
      - lambda: "(void) state;"

light:
  - platform: rgb
    id: screen_ring_light
    name: Screen Ring
    icon: mdi:circle-outline
    red: screen_ring_red_output
    green: screen_ring_green_output
    blue: screen_ring_blue_output
    gamma_correct: 1.0
    default_transition_length: 0s
    flash_transition_length: 0s
    restore_mode: RESTORE_DEFAULT_OFF
    initial_state:
      state: false
      color_mode: RGB
      brightness: 60%
      red: 25%
      green: 65%
      blue: 100%
    on_state:
      - script.execute: ui_apply_screen_ring

number:
  - platform: template
    id: screen_ring_thickness
    name: Screen Ring Thickness
    entity_category: config
    icon: mdi:circle-outline
    unit_of_measurement: px
    min_value: 1
    max_value: 40
    step: 1
    initial_value: 8
    restore_value: true
    optimistic: true
    mode: slider
    on_value:
      - script.execute: ui_apply_screen_ring

script:
  - id: ui_apply_screen_ring
    mode: restart
    then:
      - lambda: |-
          const auto &values = id(screen_ring_light).remote_values;
          auto style = AirDot::screen_ring::light_style(
            values.is_on(), values.get_brightness(), values.get_red(), values.get_green(), values.get_blue(),
            id(screen_ring_thickness).state);
          AirDot::screen_ring::apply(AirDot::lv_obj(id(screen_ring)), style);
